name: Release

# Push to "testing": run the tests and publish a GitHub pre-release
# vX.Y.Z-test.N (a test build). It is NOT sent to CurseForge, and the normal
# updater ignores it ("Update Tactara (testing).bat" installs it). Only the
# newest test build is kept.
#
# Push to "main" (merging testing once the owner has tested it): run the
# tests, and if the version in Tactara.toc hasn't been released yet, publish
# GitHub release vX.Y.Z, upload the same zip to CurseForge (when the
# CF_API_KEY secret is set) and remove that version's test builds.
# The Windows updater installs the latest release.
# Run it by hand to check the CurseForge token (nothing is uploaded) or to
# send the current version to CurseForge again after a failed upload.

on:
  push:
    branches: [main, testing]
  workflow_dispatch:
    inputs:
      curseforge:
        description: "CurseForge: check = test the token and game version, nothing uploaded; upload = send the current version again"
        type: choice
        options: [nothing, check, upload]
        default: nothing

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Tests
        run: |
          lua5.4 tests/syntax.lua Tactara
          lua5.4 tests/compile_test.lua Tactara
          lua5.4 tests/smoke_test.lua Tactara
          lua5.4 tests/helper_test.lua Tactara

      - name: Read version
        id: v
        run: |
          VERSION=$(grep -m1 '^## Version:' Tactara/Tactara.toc | sed 's/## Version:[[:space:]]*//' | tr -d '\r[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          # the license and name/logo notice travel with every download
          cp LICENSE Tactara/LICENSE.txt && cp NOTICE.md Tactara/NOTICE.md
          zip -r "Tactara-$VERSION.zip" Tactara -x "*.DS_Store"
          sed -i "s#__REPO__#${GITHUB_REPOSITORY}#" "updater/Update-Tactara.ps1"
          cp LICENSE updater/LICENSE.txt
          (cd updater && zip -r ../TactaraUpdater.zip "Update Tactara.bat" "Update Tactara (testing).bat" "Update-Tactara.ps1" LICENSE.txt)
          # release notes = this version's section of CHANGELOG.md
          awk -v v="$VERSION" '/^## /{p = ($2 == v)} p' CHANGELOG.md | tail -n +2 > notes.md
          [ -s notes.md ] || echo "Tactara $VERSION" > notes.md

      - name: Test build (testing branch)
        if: github.ref_name == 'testing'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          N: ${{ github.run_number }}
        run: |
          TAG="v$VERSION-test.$N"
          { echo "**Test build $N of Tactara $VERSION.** Not on CurseForge yet, and the normal updater won't install it."
            echo "To try it: download the Tactara zip below, or run \"Update Tactara (testing).bat\" from TactaraUpdater.zip."
            echo
            cat notes.md; } > test-notes.md
          # keep only the newest test build
          for t in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" -q '.[] | select(.prerelease) | .tag_name' | grep -- '-test\.' || true); do
            gh release delete "$t" --cleanup-tag -y
          done
          gh release create "$TAG" "Tactara-$VERSION.zip" TactaraUpdater.zip --prerelease --target "$GITHUB_SHA" \
            --title "Tactara $VERSION (test $N)" --notes-file test-notes.md

      - name: Publish release if this version is new
        id: publish
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already released - nothing to do."
            exit 0
          fi
          gh release create "v$VERSION" "Tactara-$VERSION.zip" TactaraUpdater.zip --title "Tactara $VERSION" --notes-file notes.md
          echo "created=true" >> "$GITHUB_OUTPUT"
          # this version's test builds have done their job
          for t in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" -q '.[] | select(.prerelease) | .tag_name' | grep -- "^v$VERSION-test\." || true); do
            gh release delete "$t" --cleanup-tag -y
          done

      - name: CurseForge
        # CurseForge only ever gets main (tested and approved), never a test build
        if: github.ref_name == 'main' && (steps.publish.outputs.created == 'true' || inputs.curseforge == 'upload' || inputs.curseforge == 'check')
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          MODE: ${{ (steps.publish.outputs.created == 'true' || inputs.curseforge == 'upload') && 'upload' || 'check' }}
        run: |
          if [ -z "$CF_API_KEY" ]; then
            if [ "$MODE" = check ]; then echo "::error::There's no CF_API_KEY secret."; exit 1; fi
            echo "::notice::No CF_API_KEY secret, so nothing was sent to CurseForge."
            exit 0
          fi
          awk -v v="$VERSION" '/^## /{p = ($2 == v)} p' CHANGELOG.md | tail -n +2 > cf_notes.md
          if [ "$MODE" = check ]; then
            python3 .github/scripts/curseforge_upload.py --toc Tactara/Tactara.toc \
              --file "Tactara-$VERSION.zip" --version "$VERSION" --changelog cf_notes.md --dry-run
            echo "::notice::CurseForge token works. Nothing was uploaded."
            exit 0
          fi
          # same zip as the GitHub release
          [ -f "Tactara-$VERSION.zip" ] || gh release download "v$VERSION" -p "Tactara-$VERSION.zip"
          python3 .github/scripts/curseforge_upload.py --toc Tactara/Tactara.toc \
            --file "Tactara-$VERSION.zip" --version "$VERSION" --changelog cf_notes.md
